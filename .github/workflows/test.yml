name: Test
on: [push]
jobs:
  Test:
    runs-on: ubuntu-22.04-8core
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.91
        components: clippy,rustfmt

    - name: Checkout
      uses: actions/checkout@v6

    - name: Get token to fetch private repositories
      uses: oxidecomputer/oidcx-action@main
      with:
        service: github
        repositories: oxidecomputer/permission-slip,oxidecomputer/kms-agent
        permissions: contents:read
        configure-git: true

    - name: Lint
      run: |
        cargo fmt -- --check &&
        cargo clippy -- --no-deps --deny warnings &&
        cargo clippy --tests -- --no-deps --deny warnings

    - name: Build
      run: cargo build --locked

    - name: Test
      run: |
        eval `ssh-agent -s` &&
        ssh-keygen -t ed25519 -f /tmp/id_ephemeral -C "ephemeral test key" -P "" &&
        ssh-add /tmp/id_ephemeral &&
        cargo test
