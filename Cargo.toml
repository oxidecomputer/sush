[workspace]
members = ["api", "client", "common", "server", "tests", "xtask"]
resolver = "2"

[workspace.dependencies]
async-recursion = "1"
base64 = "0.22"
blake3 = { version = "1", features = ["mmap", "rayon"] }
borsh = { version = "1", features = ["derive"] }
bytes = "1"
bytesize = "2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
crypto-bigint = "0.5"
dropshot = "0.16"
ed25519-dalek = { version = "2", features = ["rand_core"] }
function_name = "0.3"
futures = "0.3"
http = "1"
http-body-util = "0.1"
http-range-header = "0.4"
humantime = "2"
hyper = "1"
indicatif = "0.18"
libc = "0.2"
lru = "0.18"
memmap2 = "0.9"
p256 = { version = "0.13", features = ["ecdsa"] }
pem-rfc7468 = { version = "0.7", features = ["std"] }
permission-slip-client = { git = "https://github.com/oxidecomputer/permission-slip" }
permission-slip-common = { git = "https://github.com/oxidecomputer/permission-slip" }
progenitor = "0.11"
progenitor-client = "0.11"
pwd = "1"
rand = "0.8"
rand_core = "0.6"
reqwest = "0.12"
rlimit = "0.10"
rumors = { git = "https://github.com/oxidecomputer/rumors", rev = "748325407feb4c61f558713bad431281f8326ac4" }
rustix = { version = "1", features = ["process", "pty"] }
rustyline = "17"
schemars = { version = "0.8", features = ["chrono", "preserve_order"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
shlex = "1"
signature = "2"
sled-hardware-types = { git = "https://github.com/oxidecomputer/omicron", tag = "rel/v21/rc1" }
slog = "2"
slog-term = "2"
ssh-key = { version = "0.6", features = ["ed25519", "p256", "serde"] }
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }
tokio-stream = "0.1"
tokio-fd = "0.3"
tokio-tungstenite = "0.28"
tokio-util = "0.7"
uuid = { version = "1", features = ["borsh"] }
x509-cert = { version = "0.2", features = ["pem", "std"] }
xdg = "3"
