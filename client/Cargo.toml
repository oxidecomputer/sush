[package]
name = "sush-client"
description = "Oxide Support Shell Client"
version.workspace = true
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/oxidecomputer/sush"
publish = false

[[bin]]
name = "sush"
path = "src/main.rs"

[features]
# Sign job requests through Permission Slip. Off by default because the
# permission-slip repositories are private; Oxide builds turn it on.
permslip = ["dep:permission-slip-client", "dep:permission-slip-common"]

[dependencies]
async-recursion.workspace = true
atomicwrites.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
bytesize.workspace = true
chrono.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
futures.workspace = true
http.workspace = true
http-range-header.workspace = true
humantime.workspace = true
indicatif.workspace = true
libc.workspace = true
memmap2.workspace = true
p256.workspace = true
pem-rfc7468.workspace = true
permission-slip-client = { workspace = true, optional = true }
permission-slip-common = { workspace = true, optional = true }
progenitor.workspace = true
progenitor-client.workspace = true
rand.workspace = true
reqwest.workspace = true
rustix.workspace = true
rustls.workspace = true
sha3.workspace = true
slog.workspace = true
sprockets-tls.workspace = true
rustyline.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
signature.workspace = true
sled-hardware-types.workspace = true
ssh-key.workspace = true
sush-api = { path = "../api" }
sush-common = { path = "../common" }
thiserror.workspace = true
tokio.workspace = true
tokio-fd.workspace = true
tokio-tungstenite.workspace = true
x509-cert.workspace = true
xdg.workspace = true

[dev-dependencies]
tempfile.workspace = true
